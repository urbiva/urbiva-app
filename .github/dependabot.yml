version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript majors follow Next.js support; upgraded deliberately, not by bot.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @types/node tracks the supported Node.js runtime (engines: >=20.9, CI on 22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
